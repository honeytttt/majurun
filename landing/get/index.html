<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Get MajuRun — Download the App</title>
<meta name="description" content="Download MajuRun — your AI running companion. Available on the App Store and Google Play." />

<!-- Open Graph / social preview (shown if this link previews in a chat) -->
<meta property="og:title" content="Get MajuRun — Download the App" />
<meta property="og:description" content="AI training plans, GPS tracking, voice coaching and a social running feed. Download MajuRun free." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://www.majurun.com/get" />
<meta property="og:image" content="https://www.majurun.com/img/home-ss.jpeg" />
<meta name="theme-color" content="#0F0F1F" />
<link rel="icon" type="image/png" href="/img/app_icon.png" />

<!-- Apple Smart App Banner — offers the app directly on iOS Safari -->
<meta name="apple-itunes-app" content="app-id=6761485707" />

<style>
  :root{
    --bg:#0B0B14; --card:#15152A; --line:#23233C;
    --green:#00E676; --text:#F4F4F8; --muted:#9A9AB5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px; text-align:center;
  }
  .box{max-width:420px;width:100%}
  .logo{width:76px;height:76px;border-radius:20px;margin:0 auto 20px;display:block}
  h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:10px}
  p.sub{color:var(--muted);font-size:15.5px;margin-bottom:28px}
  .stores{display:flex;flex-direction:column;gap:14px}
  .store{display:flex;align-items:center;gap:13px;justify-content:center;
    background:#101024;border:1px solid var(--line);padding:14px 18px;border-radius:14px;
    transition:border-color .15s,transform .15s;color:var(--text)}
  .store:hover{border-color:var(--green);transform:translateY(-2px)}
  .store .ico{font-size:26px}
  .store small{display:block;font-size:11px;color:var(--muted);line-height:1.2;text-align:left}
  .store strong{font-size:17px;font-weight:700;text-align:left;display:block}
  a{text-decoration:none;color:inherit}
  .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--green);
    border-radius:50%;margin:8px auto 18px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .redir{color:var(--muted);font-size:13.5px;margin-top:18px}
  .foot{margin-top:26px}
  .foot a{color:var(--muted);font-size:13.5px}
  .foot a:hover{color:var(--text)}
</style>
</head>
<body>
  <div class="box">
    <img class="logo" src="/img/app_icon.png" alt="MajuRun" />
    <h1>Get <span style="color:var(--green)">MajuRun</span></h1>
    <p class="sub">Your AI running companion — GPS tracking, voice coaching, training plans and a social feed.</p>

    <div class="spinner" id="spinner"></div>

    <div class="stores">
      <a class="store" id="ios" href="https://apps.apple.com/app/majurun/id6761485707">
        <span class="ico"></span>
        <span><small>Download on the</small><strong>App Store</strong></span>
      </a>
      <a class="store" id="android" href="https://play.google.com/store/apps/details?id=com.majurun.app">
        <span class="ico">▶</span>
        <span><small>Get it on</small><strong>Google Play</strong></span>
      </a>
    </div>

    <p class="redir" id="redir">Redirecting you to your app store…</p>

    <div class="foot"><a href="/">← Back to majurun.com</a></div>
  </div>

<script>
  (function () {
    // ── TEMPORARY: Android production is approved but NOT yet published, so the
    // Play Store listing 404s for non-testers. While ANDROID_LIVE is false,
    // Android visitors are NOT sent to a dead Play link — they stay on this
    // branded page with a "coming soon" message. Flip ANDROID_LIVE to true the
    // moment the Google Play production release is public (and nothing else
    // needs changing — the Play button and redirect both follow this flag).
    var ANDROID_LIVE = true;

    var APP_STORE = 'https://apps.apple.com/app/majurun/id6761485707';
    var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.majurun.app';
    var LANDING = 'https://www.majurun.com';

    var ua = (navigator.userAgent || navigator.vendor || window.opera || '').toLowerCase();
    var isIOS = /iphone|ipad|ipod/.test(ua) ||
      // iPadOS 13+ reports as Mac; detect via touch support
      (/macintosh/.test(ua) && 'ontouchend' in document);
    var isAndroid = /android/.test(ua);

    var spinner = document.getElementById('spinner');
    var redir = document.getElementById('redir');
    var androidBtn = document.getElementById('android');

    // Keep the visible Google Play button honest while Android is pre-launch so
    // a no-JS / desktop click is never a dead 404 link.
    if (!ANDROID_LIVE && androidBtn) {
      androidBtn.href = LANDING;
      androidBtn.querySelector('small').textContent = 'Coming soon to';
    }

    if (isIOS) {
      // Show only the relevant store, then forward.
      if (androidBtn) androidBtn.style.display = 'none';
      window.location.replace(APP_STORE);
    } else if (isAndroid && ANDROID_LIVE) {
      document.getElementById('ios').style.display = 'none';
      window.location.replace(PLAY_STORE);
    } else if (isAndroid) {
      // Pre-launch Android: don't redirect to a dead store link — stay here.
      if (spinner) spinner.style.display = 'none';
      if (redir) {
        redir.textContent =
          'MajuRun for Android is launching on Google Play very soon.';
      }
    } else {
      // Desktop / unknown — no auto-redirect; let the user choose a store.
      if (spinner) spinner.style.display = 'none';
      if (redir) redir.textContent = 'Choose your platform to download MajuRun.';
    }
  })();
</script>
</body>
</html>
