  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA9sCbH0hZRUO2wxk9IClyZC9DNcHCZBNY&libraries=places,geometry&loading=async"></script>

  <script src="flutter_bootstrap.js" async></script>

<body>
  <!-- ✅ CRITICAL: reCAPTCHA container - MUST be first in body -->
  <div id="recaptcha-container" style="position: fixed; bottom: 0; right: 0; z-index: 9999;"></div>

  <!-- ✅ PRELOAD reCAPTCHA v2 - Force immediate load -->
  <script>
    // Force load reCAPTCHA immediately
    (function() {
      var script = document.createElement('script');
      script.src = 'https://www.google.com/recaptcha/api.js?onload=onRecaptchaLoad&render=explicit';
      script.async = true;
      script.defer = true;
      document.head.appendChild(script);
    })();

    window.onRecaptchaLoad = function() {
      console.log('✅ reCAPTCHA v2 loaded and ready');
      const container = document.getElementById('recaptcha-container');
      if (container) {
        container.style.display = 'block';
        // Actually render the checkbox
        grecaptcha.enterprise = undefined; // Remove Enterprise
        grecaptcha.render('recaptcha-container', {
          sitekey: '6LfJE2gsAAAAAP2xeAzsC95tz7jAzim7wAjtarF0', // YOUR V2 KEY
          callback: function(token) {
            console.log('✅ reCAPTCHA verified');
          }
        });
      }
    };

    // Wake Lock API
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          console.log('🔒 Wake Lock activated');
        }
      } catch (err) {
        console.error('❌ Wake Lock error:', err);
      }
    }
    
    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release();
        wakeLock = null;
        console.log('🔓 Wake Lock released');
      }
    }
    
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible' && wakeLock !== null) {
        await requestWakeLock();
      }
    });
    
    window.requestWakeLock = requestWakeLock;
    window.releaseWakeLock = releaseWakeLock;
  </script>
</body>
</html>
